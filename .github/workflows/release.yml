name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以 v 开头的 tag，如 v1.0.0

permissions:
  contents: write

jobs:
  # 生成 Changelog
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成 changelog

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

  # 构建 opslab 的多合一 CLI（真 kubectl + helm，编译成 WebAssembly）
  #
  # 产物约 136MB，不进仓库（见 .gitignore），所以必须在 CI 里现编 ——
  # 少了它，安装包里 /opslab/opslab-cli.wasm 会 404，整个 ops 工作台一条命令都跑不了。
  #
  # 只编一次给四个平台共用：产物是 GOOS=js GOARCH=wasm 交叉编译出来的，
  # 跟 runner 的操作系统无关，所以在三种 runner 上各编一遍纯属浪费。
  build-wasm:
    name: Build opslab WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 脚本生成的 go.mod 要求 go 1.26；1.27 是本地验证过能复现产物的那个版本
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # 构建脚本是现生成 go.mod 的，仓库里没有 go.sum，开缓存只会报警告
          cache: false

      - name: Build opslab CLI WASM
        run: bash scripts/build-opslab-wasm.sh

      # 产物没出来就当场失败，别让后面四个 job 白跑一遍再发一个坏包
      - name: Verify build output
        run: |
          ls -l public/opslab/
          test -s public/opslab/opslab-cli.wasm
          test -s public/opslab/wasm_exec.js
          SIZE=$(stat -c%s public/opslab/opslab-cli.wasm)
          echo "opslab-cli.wasm: $SIZE bytes"
          # 正常在 130MB 上下；小于 50MB 基本可以断定链接阶段出了问题
          if [ "$SIZE" -lt 50000000 ]; then
            echo "::error::opslab-cli.wasm is only $SIZE bytes — build looks truncated."
            exit 1
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: opslab-wasm
          # 两个文件的公共前缀是 public/opslab，所以 artifact 里就是这两个文件名，
          # 下载时 path: public/opslab 正好落回原位
          path: |
            public/opslab/opslab-cli.wasm
            public/opslab/wasm_exec.js
          if-no-files-found: error
          retention-days: 1

  # 核对 llmlab 的算子核：仓库里那份 .wasm 是不是真的由仓库里那份 C 编出来的
  #
  # 和上面的 opslab 相反 —— 算子核只有 37KB，所以**产物是进仓库的**，
  # CI 不需要现编，也就不需要往下游 job 传 artifact。
  # 但入库的代价是它会过期：改了 .c 忘了重建，代码看着是新的、跑的是旧的，
  # 而且不报任何错。这个 job 就是那道闸门。
  #
  # 它必须能复现，所以 wasi-sdk 的版本是钉死的，编译参数里也没有 -ffast-math
  # （那东西允许浮点重结合，会同时毁掉字节一致与「训练两遍逐位一致」那条门槛）。
  verify-kernels:
    name: Verify llmlab kernels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild and compare
        run: bash scripts/build-llmlab-kernels.sh --check

      # nanotorch 的 .py 会被嵌进一个生成的 TS 模块。改了 .py 忘了重新生成，
      # 表现同样是「代码看着是新的、跑的是旧的」，而且不报任何错。
      - name: Check nanotorch sources are in sync
        run: node scripts/build-nanotorch.js --check

  # 构建 macOS 版本
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [changelog, build-wasm, verify-kernels]
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (required for DMG building)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # build-wasm 编好的多合一 CLI。落回 public/opslab/，electron-builder 才打得进包。
      - name: Download opslab WASM
        uses: actions/download-artifact@v4
        with:
          name: opslab-wasm
          path: public/opslab

      # 路径错一格就是一个功能全灭的包，所以这里当场验，而不是等发出去才发现
      - name: Verify opslab WASM is in place
        shell: bash
        run: |
          ls -l public/opslab/
          test -s public/opslab/opslab-cli.wasm
          test -s public/opslab/wasm_exec.js

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      # 导入 Apple 开发者证书用于签名（如果配置了证书）
      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 检查是否配置了证书
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate configured, skipping code signing"
            echo "HAS_CERTIFICATE=false" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "HAS_CERTIFICATE=true" >> $GITHUB_ENV
          
          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # 创建钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入证书
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          # 设置钥匙串搜索列表
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # 允许 codesign 访问钥匙串中的密钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 清理证书文件
          rm -f $RUNNER_TEMP/certificate.p12
          
          echo "✓ Code signing certificate imported successfully"

      - name: Build Electron app (macOS ${{ matrix.arch }})
        run: |
          npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如果没有证书，禁用自动签名发现
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_CERTIFICATE == 'true' }}
          # 公证相关环境变量（仅在配置了证书时有效）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # v0.17.0 与 v0.17.1 两次都把 Info.plist 停在 0.16.1 的包发了出去 ——
      # 配置里手写了一行 bundleShortVersion，package.json 涨了三个版本它都不动。
      # 产物文件名、Release、官网全对，只有「关于」面板不对，所以没人发现。
      # 这一步在签名校验之前先把版本号钉住：对不上就当场失败，别再发出去。
      - name: Verify packaged version matches package.json
        run: node scripts/check-app-version.js

      # v0.5.0 曾经把一个签名损坏的包发出去：electron-builder 跳过签名后，
      # 包里只剩 Electron 二进制自带的 linker ad-hoc 签名，而它已经描述不了被改写过的
      # bundle。macOS 15+ 对这种情况的判定是 "revoked"，直接当成恶意软件丢进废纸篓。
      # 这一步保证签名坏掉时构建失败，而不是发布出去。
      - name: Verify macOS code signature
        run: |
          APP=$(find dist -maxdepth 2 -name "AlgoLocal.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No AlgoLocal.app found under dist/"
            exit 1
          fi
          echo "Verifying $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier=|flags=|Authority=" || true

          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error::Code signature is invalid — refusing to publish."
            exit 1
          fi

          # 签名标识必须是我们自己的 appId。如果这里还是 "Electron"，
          # 说明 bundle 根本没被重新签过，正是 v0.5.0 的故障形态。
          IDENT=$(codesign -dv "$APP" 2>&1 | sed -n 's/^Identifier=//p')
          if [ "$IDENT" != "com.algolocal.app" ]; then
            echo "::error::Unexpected signing identifier '$IDENT' (expected com.algolocal.app)."
            exit 1
          fi

          # spctl 的判定：没有 Developer ID 时 "rejected" 是预期结果（用户可以在
          # 系统设置里放行）；"revoked" 则是硬拦截，必须拦下。
          VERDICT=$(spctl -a -vvv -t exec "$APP" 2>&1 || true)
          echo "$VERDICT"
          if echo "$VERDICT" | grep -q "revoked"; then
            echo "::error::Gatekeeper reports this build as revoked — it would be quarantined as malware."
            exit 1
          fi
          echo "✓ Signature verified (identifier=$IDENT)"

      # 清理钥匙串
      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # 构建 Windows 版本
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [changelog, build-wasm, verify-kernels]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build-wasm 编好的多合一 CLI。落回 public/opslab/，electron-builder 才打得进包。
      - name: Download opslab WASM
        uses: actions/download-artifact@v4
        with:
          name: opslab-wasm
          path: public/opslab

      # 路径错一格就是一个功能全灭的包，所以这里当场验，而不是等发出去才发现
      - name: Verify opslab WASM is in place
        shell: bash
        run: |
          ls -l public/opslab/
          test -s public/opslab/opslab-cli.wasm
          test -s public/opslab/wasm_exec.js

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      - name: Build Electron app (Windows)
        run: |
          npx electron-builder --win --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error

  # 构建 Linux 版本
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [changelog, build-wasm, verify-kernels]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build-wasm 编好的多合一 CLI。落回 public/opslab/，electron-builder 才打得进包。
      - name: Download opslab WASM
        uses: actions/download-artifact@v4
        with:
          name: opslab-wasm
          path: public/opslab

      # 路径错一格就是一个功能全灭的包，所以这里当场验，而不是等发出去才发现
      - name: Verify opslab WASM is in place
        shell: bash
        run: |
          ls -l public/opslab/
          test -s public/opslab/opslab-cli.wasm
          test -s public/opslab/wasm_exec.js

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      - name: Build Electron app (Linux)
        run: |
          npx electron-builder --linux --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # 创建 Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [changelog, build-macos, build-windows, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name "*" | head -50

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # macOS
          cp artifacts/macos-x64/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/macos-x64/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/macos-arm64/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/macos-arm64/*.zip release-assets/ 2>/dev/null || true
          # Windows
          cp artifacts/windows/*.exe release-assets/ 2>/dev/null || true
          # Linux
          cp artifacts/linux/*.AppImage release-assets/ 2>/dev/null || true
          cp artifacts/linux/*.deb release-assets/ 2>/dev/null || true
          cp artifacts/linux/*.rpm release-assets/ 2>/dev/null || true
          
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AlgoLocal v${{ needs.changelog.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## AlgoLocal v${{ needs.changelog.outputs.version }}
            
            Practice coding algorithms 100% offline with AI: generate problems, get hints, discuss solutions, and run code in JavaScript, TypeScript, or Python — no internet or setup required.
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | **macOS** | Apple Silicon (M1/M2/M3) | `AlgoLocal-*-macOS-arm64.dmg` |
            | **macOS** | Intel | `AlgoLocal-*-macOS-x64.dmg` |
            | **Windows** | 64-bit Installer | `AlgoLocal-*-Windows-Setup.exe` |
            | **Windows** | 64-bit Portable | `AlgoLocal-*-Windows-Portable.exe` |
            | **Linux** | AppImage | `AlgoLocal-*-Linux.AppImage` |
            | **Linux** | Debian/Ubuntu | `AlgoLocal-*-Linux.deb` |
            | **Linux** | Fedora/RHEL | `AlgoLocal-*-Linux.rpm` |
            
            ### Opening the app on macOS
            
            These builds are signed ad-hoc, not with an Apple Developer ID, so macOS will
            warn that it cannot verify the developer. Opening it takes two steps:
            
            1. Drag **AlgoLocal** to your Applications folder and double-click it. macOS will
               refuse and say it cannot verify the app is free of malware. Click **Done**.
            2. Open **System Settings → Privacy & Security**, scroll to the Security section,
               and click **Open Anyway** next to AlgoLocal. Confirm with Touch ID or your password.
            
            You only need to do this once.
            
            **Note for macOS Sequoia (15) and later:** the old Control-click → Open shortcut no
            longer bypasses Gatekeeper. System Settings is the only route.
            
            The `xattr -rd com.apple.quarantine` command that older release notes recommended is
            no longer needed, and on its own it will not help.
            
            ### Changelog
            
            ${{ needs.changelog.outputs.changelog }}
            
            ---
            
            ### 中文说明
            
            100% 离线刷算法，AI 全程辅助：生成题目、获取提示、讨论解法，支持 JavaScript、TypeScript、Python 代码运行——无需联网或配置环境。
            
            **macOS 打开方式**：这些安装包使用 ad-hoc 签名，没有 Apple Developer ID 证书，
            所以 macOS 会提示无法验证开发者。分两步打开：
            
            1. 把 **AlgoLocal** 拖进「应用程序」文件夹并双击，系统会拒绝并提示无法确认它不含
               恶意软件，点「完成」。
            2. 打开 **系统设置 → 隐私与安全性**，下拉到「安全性」一栏，点 AlgoLocal 旁边的
               **仍要打开**，用触控 ID 或密码确认。
            
            这一步只需要做一次。
            
            **macOS Sequoia（15）及以上注意**：过去「右键 → 打开」的绕过方式已经被移除，
            只能走系统设置这条路。旧版发布说明里的 `xattr -rd com.apple.quarantine` 已经不需要，
            单独执行它也解决不了问题。
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✓ Release created successfully!"
          echo "Version: v${{ needs.changelog.outputs.version }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

