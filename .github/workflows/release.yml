name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送以 v 开头的 tag，如 v1.0.0

permissions:
  contents: write

jobs:
  # 生成 Changelog
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成 changelog

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

  # 构建 macOS 版本
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: changelog
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (required for DMG building)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      # 导入 Apple 开发者证书用于签名（如果配置了证书）
      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 检查是否配置了证书
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate configured, skipping code signing"
            echo "HAS_CERTIFICATE=false" >> $GITHUB_ENV
            exit 0
          fi
          
          echo "HAS_CERTIFICATE=true" >> $GITHUB_ENV
          
          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # 创建钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入证书
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          # 设置钥匙串搜索列表
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # 允许 codesign 访问钥匙串中的密钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 清理证书文件
          rm -f $RUNNER_TEMP/certificate.p12
          
          echo "✓ Code signing certificate imported successfully"

      - name: Build Electron app (macOS ${{ matrix.arch }})
        run: |
          npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如果没有证书，禁用自动签名发现
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_CERTIFICATE == 'true' }}
          # 公证相关环境变量（仅在配置了证书时有效）
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 清理钥匙串
      - name: Cleanup Keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # 构建 Windows 版本
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      - name: Build Electron app (Windows)
        run: |
          npx electron-builder --win --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error

  # 构建 Linux 版本
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons:generate

      - name: Build Next.js
        run: npm run build

      - name: Build Electron app (Linux)
        run: |
          npx electron-builder --linux --config electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # 创建 Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [changelog, build-macos, build-windows, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -name "*" | head -50

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # macOS
          cp artifacts/macos-x64/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/macos-x64/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/macos-arm64/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/macos-arm64/*.zip release-assets/ 2>/dev/null || true
          # Windows
          cp artifacts/windows/*.exe release-assets/ 2>/dev/null || true
          # Linux
          cp artifacts/linux/*.AppImage release-assets/ 2>/dev/null || true
          cp artifacts/linux/*.deb release-assets/ 2>/dev/null || true
          cp artifacts/linux/*.rpm release-assets/ 2>/dev/null || true
          
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AlgoLocal v${{ needs.changelog.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## AlgoLocal v${{ needs.changelog.outputs.version }}
            
            Practice coding algorithms 100% offline with AI: generate problems, get hints, discuss solutions, and run code in JavaScript, TypeScript, or Python — no internet or setup required.
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | **macOS** | Apple Silicon (M1/M2/M3) | `AlgoLocal-*-macOS-arm64.dmg` |
            | **macOS** | Intel | `AlgoLocal-*-macOS-x64.dmg` |
            | **Windows** | 64-bit Installer | `AlgoLocal-*-Windows-Setup.exe` |
            | **Windows** | 64-bit Portable | `AlgoLocal-*-Windows-Portable.exe` |
            | **Linux** | AppImage | `AlgoLocal-*-Linux.AppImage` |
            | **Linux** | Debian/Ubuntu | `AlgoLocal-*-Linux.deb` |
            | **Linux** | Fedora/RHEL | `AlgoLocal-*-Linux.rpm` |
            
            ### macOS Installation Note
            
            If you see **"damaged"** or **"cannot verify developer"** message when opening the app, run this command in Terminal:
            
            ```bash
            # For app installed from DMG
            sudo xattr -rd com.apple.quarantine /Applications/AlgoLocal.app
            
            # Or for app extracted from ZIP (adjust path accordingly)
            sudo xattr -rd com.apple.quarantine ~/Downloads/AlgoLocal.app
            ```
            
            ### Changelog
            
            ${{ needs.changelog.outputs.changelog }}
            
            ---
            
            ### 中文说明
            
            100% 离线刷算法，AI 全程辅助：生成题目、获取提示、讨论解法，支持 JavaScript、TypeScript、Python 代码运行——无需联网或配置环境。
            
            **macOS 安装提示**：如果打开应用时提示"已损坏"或"无法验证开发者"，请在终端运行：
            
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/AlgoLocal.app
            ```
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✓ Release created successfully!"
          echo "Version: v${{ needs.changelog.outputs.version }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

